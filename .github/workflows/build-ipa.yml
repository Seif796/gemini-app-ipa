name: Build iOS .IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build & Package iOS .IPA
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Client Dependencies
        run: |
          cd client
          npm install

      - name: Build Web Application
        run: |
          cd client
          npm run build

      - name: Prepare Capacitor iOS Project
        run: |
          cd client
          npx cap add ios || true
          npx cap sync ios

      - name: Install CocoaPods Dependencies
        run: |
          cd client/ios/App
          pod install || true

      - name: Build iOS Application (Release)
        run: |
          cd client/ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            clean build

      - name: Package .IPA
        run: |
          cd client/ios/App
          APP_PATH=$(find build -name "App.app" -type d | head -n 1)
          echo "Found compiled App.app at: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -qr Seif-Ai-Test.ipa Payload
          echo "IPA packaging successful!"
          ls -lh Seif-Ai-Test.ipa

      - name: Upload .IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Seif-Ai-Test-iOS-IPA
          path: client/ios/App/Seif-Ai-Test.ipa
          retention-days: 14
