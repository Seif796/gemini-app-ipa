name: Build iOS .IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build & Package IPA
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Client Dependencies
        run: |
          cd client
          npm ci || npm install

      - name: Build Web Application
        run: |
          cd client
          npm run build

      - name: Initialize Capacitor iOS Project
        run: |
          cd client
          npx cap add ios || true
          npx cap sync ios

      - name: Build Xcode Archive (Release)
        run: |
          cd client/ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$PWD/build/App.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package Payload into .IPA
        run: |
          cd client/ios/App
          mkdir -p build/Payload
          cp -r "build/App.xcarchive/Products/Applications/App.app" build/Payload/
          cd build
          zip -r Aether-AI.ipa Payload
          echo "IPA packaging complete!"
          ls -lh Aether-AI.ipa

      - name: Upload .IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aether-AI-iOS-IPA
          path: client/ios/App/build/Aether-AI.ipa
          retention-days: 14
