name: Build iOS .IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    name: Build & Package iOS .IPA
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Client Dependencies
        run: |
          cd client
          npm install

      - name: Build Web Application
        run: |
          cd client
          npm run build

      - name: Prepare Capacitor iOS Project
        run: |
          cd client
          npx cap add ios || true
          npx cap sync ios

      - name: Install CocoaPods Dependencies
        run: |
          cd client/ios/App
          pod install || true

      - name: Build iOS Application (Release)
        run: |
          cd client/ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            clean build

      - name: Package .IPA & ZIP
        run: |
          cd client/ios/App
          APP_PATH=$(find build -name "App.app" -type d | head -n 1)
          echo "Found compiled App.app at: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -qr Seif-Ai-Test.ipa Payload
          zip -qr Seif-Ai-Test-iOS.zip Seif-Ai-Test.ipa
          echo "IPA & ZIP packaging successful!"
          ls -lh Seif-Ai-Test.ipa Seif-Ai-Test-iOS.zip

      - name: Upload .IPA Artifact to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: Seif-Ai-Test-iOS-IPA
          path: |
            client/ios/App/Seif-Ai-Test.ipa
            client/ios/App/Seif-Ai-Test-iOS.zip
          retention-days: 14

      - name: Publish Direct Release on GitHub (No Login Needed)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Seif AI Companion - Latest Release (iOS .IPA + Laptop .EXE)"
          body: |
            ## 📱 Seif AI Companion - Direct Download Links

            ### 🍏 iPhone (iOS)
            - **Direct .IPA File:** [Download Seif-Ai-Test.ipa](https://github.com/${{ github.repository }}/releases/download/latest/Seif-Ai-Test.ipa)
            - **Zip Archive:** [Download Seif-Ai-Test-iOS.zip](https://github.com/${{ github.repository }}/releases/download/latest/Seif-Ai-Test-iOS.zip)

            ### 💻 Laptop / Computer (Windows)
            - See Desktop Assets attached below or in the Desktop release workflow.

            > ⚡ **Direct download:** No login required! Simply tap the link above to download.
          files: |
            client/ios/App/Seif-Ai-Test.ipa
            client/ios/App/Seif-Ai-Test-iOS.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
