name: Build Laptop Desktop App (.EXE)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build & Package Windows Laptop App
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Client Dependencies
        run: |
          cd client
          npm install

      - name: Build Web Application
        run: |
          cd client
          npm run build

      - name: Package Windows Desktop App (.EXE & Portable)
        run: |
          cd client
          npx electron-builder --win --x64 --publish never -c.win.signAndEditExecutable=false
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Create Portable Zip Archive
        run: |
          cd client/release
          if (Test-Path win-unpacked) {
            Compress-Archive -Path win-unpacked/* -DestinationPath "Seif-AI-Laptop-Portable.zip" -Force
          }
          Get-ChildItem -Path . -Recurse

      - name: Upload Windows Laptop App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Seif-AI-Laptop-Windows-App
          path: |
            client/release/*.exe
            client/release/*.zip
          retention-days: 14

      - name: Publish Desktop Files to GitHub Release (No Login Needed)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Seif AI Companion - Latest Release (iOS .IPA + Laptop .EXE)"
          files: |
            client/release/*.exe
            client/release/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
