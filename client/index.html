<!doctype html>
<html lang="en" style="background-color: #07090e; color: #f8fafc;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Seif Ai Test</title>
    
    <!-- iOS Native App Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Seif Ai Test" />
    <meta name="theme-color" content="#07090e" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Icons & Manifest -->
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="./logo.svg" />

    <style>
      html, body {
        margin: 0;
        padding: 0;
        background-color: #07090e !important;
        color: #f8fafc;
        width: 100%;
        height: 100%;
        overflow-x: hidden;
        -webkit-tap-highlight-color: transparent;
      }
      #root {
        min-height: 100vh;
        min-height: 100dvh;
        background-color: #07090e;
      }
    </style>

    <script>
      // Global error safeguard - catches script load failures or parsing errors
      window.addEventListener('error', function(e) {
        console.error('Initial load error:', e);
        var r = document.getElementById('root');
        if (r && (!r.children || r.children.length === 0 || r.querySelector('.app-initial-loader'))) {
          r.innerHTML = '<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#07090e;color:#fff;padding:24px;text-align:center;font-family:-apple-system,sans-serif;">' +
            '<div style="font-size:42px;margin-bottom:14px;">⚠️</div>' +
            '<h2 style="font-size:18px;margin-bottom:8px;">تعذر تحميل التطبيق / Load Error</h2>' +
            '<p style="font-size:12px;color:#94a3b8;max-width:320px;margin-bottom:20px;line-height:1.5;">' + (e.message || 'Script error') + '</p>' +
            '<button onclick="location.reload()" style="padding:12px 24px;background:#38bdf8;color:#000;border:none;border-radius:14px;font-weight:700;font-size:14px;cursor:pointer;">إعادة المحاولة / Reload</button>' +
            '</div>';
        }
      });
    </script>

    <!-- Apple SF Pro Font Preload & Styling -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  </head>
  <body style="background-color: #07090e; color: #f8fafc;">
    <div id="root">
      <div class="app-initial-loader" style="min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#07090e;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif;padding:20px;text-align:center;">
        <div style="width:56px;height:56px;border-radius:18px;background:#131522;border:1.5px solid rgba(56,189,248,0.3);display:flex;align-items:center;justify-content:center;margin-bottom:16px;box-shadow:0 0 25px rgba(56,189,248,0.25);">
          <span style="font-size:28px;">✨</span>
        </div>
        <div style="font-size:17px;font-weight:700;margin-bottom:6px;letter-spacing:-0.3px;">Seif Ai Test</div>
        <div style="font-size:12px;color:#94a3b8;">جاري التحميل... / Loading...</div>
      </div>
    </div>
    <script type="module" src="./src/main.jsx"></script>
  </body>
</html>
